message EditorStateMessage {
  message Document {
    message Position {
      int32 line = 1;
      int32 character = 2;
    }

    message Range {
      gemini_coder.agent_ui_toolkit.iframe.EditorStateMessage.Document.Position start = 1;
      gemini_coder.agent_ui_toolkit.iframe.EditorStateMessage.Document.Position end = 2;
    }

    string uri = 1;
    int32 version = 2;
    string language_id = 3;
    gemini_coder.agent_ui_toolkit.iframe.EditorStateMessage.Document.Range selection = 4;
    gemini_coder.agent_ui_toolkit.iframe.EditorStateMessage.Document.Range visible_range = 5;
    string text = 6;
  }

  string action = 1;
  gemini_coder.agent_ui_toolkit.iframe.EditorStateMessage.Document active_document = 2;
  repeated gemini_coder.agent_ui_toolkit.iframe.EditorStateMessage.Document other_documents = 3;
}

