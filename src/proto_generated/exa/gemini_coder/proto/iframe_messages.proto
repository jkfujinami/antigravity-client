service AntigravityApi {
  rpc GetUrl(gemini_coder.agent_ui_toolkit.iframe.UrlQueryMessage) returns (gemini_coder.agent_ui_toolkit.iframe.UrlResponseMessage);
  rpc Navigate(gemini_coder.agent_ui_toolkit.iframe.UrlNavigateMessage) returns (gemini_coder.agent_ui_toolkit.iframe.UrlNavigateResponse);
  rpc SetEditorState(gemini_coder.agent_ui_toolkit.iframe.EditorStateMessage) returns (gemini_coder.agent_ui_toolkit.iframe.EditorStateResponse);
  rpc SetContextCategories(gemini_coder.agent_ui_toolkit.iframe.SetContextCategoriesRequest) returns (gemini_coder.agent_ui_toolkit.iframe.SetContextCategoriesResponse);
  rpc InsertSnippet(gemini_coder.agent_ui_toolkit.iframe.InsertSnippetRequest) returns (gemini_coder.agent_ui_toolkit.iframe.InsertSnippetResponse);
  rpc AddContext(gemini_coder.agent_ui_toolkit.iframe.AddContextRequest) returns (gemini_coder.agent_ui_toolkit.iframe.AddContextResponse);
  rpc SetTheme(gemini_coder.agent_ui_toolkit.iframe.ThemeChangeMessage) returns (gemini_coder.agent_ui_toolkit.iframe.ThemeChangeResponse);
  rpc AddSkills(gemini_coder.agent_ui_toolkit.iframe.AddSkillsMessage) returns (gemini_coder.agent_ui_toolkit.iframe.AddSkillsResponse);
  rpc SetComments(gemini_coder.agent_ui_toolkit.iframe.SetCommentsRequest) returns (gemini_coder.agent_ui_toolkit.iframe.SetCommentsResponse);
  rpc NewConversation(gemini_coder.agent_ui_toolkit.iframe.NewConversationRequest) returns (gemini_coder.agent_ui_toolkit.iframe.NewConversationResponse);
  rpc AddFileComment(gemini_coder.agent_ui_toolkit.iframe.AddFileCommentRequest) returns (gemini_coder.agent_ui_toolkit.iframe.AddFileCommentResponse);
  rpc DeleteFileComment(gemini_coder.agent_ui_toolkit.iframe.DeleteFileCommentRequest) returns (gemini_coder.agent_ui_toolkit.iframe.DeleteFileCommentResponse);
  rpc EditFileComment(gemini_coder.agent_ui_toolkit.iframe.EditFileCommentRequest) returns (gemini_coder.agent_ui_toolkit.iframe.EditFileCommentResponse);
  rpc TriggerSend(gemini_coder.agent_ui_toolkit.iframe.TriggerSendRequest) returns (gemini_coder.agent_ui_toolkit.iframe.TriggerSendResponse);
  rpc SendCommand(gemini_coder.agent_ui_toolkit.iframe.SendCommandRequest) returns (gemini_coder.agent_ui_toolkit.iframe.SendCommandResponse);
  rpc ListCommands(gemini_coder.agent_ui_toolkit.iframe.ListCommandsRequest) returns (gemini_coder.agent_ui_toolkit.iframe.ListCommandsResponse);
}

