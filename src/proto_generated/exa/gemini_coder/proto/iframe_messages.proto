    gemini_coder.agent_ui_toolkit.iframe.NotificationRequestMessage notification_request = 5;
    gemini_coder.agent_ui_toolkit.iframe.NotificationPermissionQueryMessage notification_permission_query = 6;
    gemini_coder.agent_ui_toolkit.iframe.NotificationPermissionStateMessage notification_permission_state = 7;
    gemini_coder.agent_ui_toolkit.iframe.NotificationPermissionRequestMessage notification_permission_request = 8;
    gemini_coder.agent_ui_toolkit.iframe.EnvQueryMessage env_query = 9;
    gemini_coder.agent_ui_toolkit.iframe.EnvStateMessage env_state = 10;
    gemini_coder.agent_ui_toolkit.iframe.EnvironmentChangeMessage env_change = 11;
    gemini_coder.agent_ui_toolkit.iframe.TitleChangeMessage title_change = 12;
    gemini_coder.agent_ui_toolkit.iframe.ThemeChangeMessage theme_change = 13;
    gemini_coder.agent_ui_toolkit.iframe.AddSkillsMessage add_skills = 14;
    gemini_coder.agent_ui_toolkit.iframe.EditorStateMessage editor_state = 15;
    gemini_coder.agent_ui_toolkit.iframe.GcertRenewRequestMessage gcert_renew_request = 16;
    gemini_coder.agent_ui_toolkit.iframe.DownloadRequestMessage download_request = 17;
    gemini_coder.agent_ui_toolkit.iframe.FaviconBadgeChangeMessage favicon_badge_change = 18;
    gemini_coder.agent_ui_toolkit.iframe.NotificationClearRequestMessage notification_clear_request = 19;
    gemini_coder.agent_ui_toolkit.iframe.InstancesQueryMessage instances_query = 20;
    gemini_coder.agent_ui_toolkit.iframe.InstancesResponseMessage instances_response = 21;
    gemini_coder.agent_ui_toolkit.iframe.SelectInstanceMessage select_instance = 22;
    gemini_coder.agent_ui_toolkit.iframe.NotificationDismissMessage notification_dismiss = 23;
  }
}

